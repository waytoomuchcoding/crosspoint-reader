name: Compile Release

# Automatically build and publish a GitHub Release whenever a version tag is pushed
# (e.g. v2.1.0 or 2.1.0), when a release is published manually, or via workflow_dispatch.

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v2.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  RESOLVED_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  IS_PRERELEASE: ${{ github.event.release.prerelease == true || contains(github.event.release.tag_name || inputs.tag || github.ref_name, 'rc') }}

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_env: gh_release
            rc_env: gh_release_rc
            device: x3-x4
          - release_env: sticky-gh_release
            rc_env: sticky-gh_release_rc
            device: sticky
          - release_env: x4pro-gh_release
            rc_env: x4pro-gh_release_rc
            device: x4pro
          - release_env: x4c-gh_release
            rc_env: x4c-gh_release_rc
            device: x4c
          - release_env: papermono-gh_release
            rc_env: papermono-gh_release_rc
            device: papermono
          - release_env: metalio_eink4-gh_release
            rc_env: metalio_eink4-gh_release_rc
            device: metalio_eink4
          - release_env: eego_a4-gh_release
            rc_env: eego_a4-gh_release_rc
            device: eego_a4
          - release_env: picco-gh_release
            rc_env: picco-gh_release_rc
            device: picco
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RESOLVED_TAG }}
          submodules: recursive

      - name: Sync release version from tag
        env:
          RELEASE_TAG: ${{ env.RESOLVED_TAG }}
        run: |
          version="${RELEASE_TAG#v}"
          base_version="${version%%-*}"
          base_version="${base_version%rc*}"
          sed -i "s/^version = .*/version = ${base_version}/" platformio.ini
          echo "Building release version: ${version} (base: ${base_version})"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        env:
          PIO_ENV: ${{ env.IS_PRERELEASE == 'true' && matrix.rc_env || matrix.release_env }}
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig run a nested `pio run` from
          # ~/.platformio/penv. Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build CrossPoint
        env:
          PIO_ENV: ${{ env.IS_PRERELEASE == 'true' && matrix.rc_env || matrix.release_env }}
          # Enrollment gate for the LCP service: official releases carry this
          # key, self-builds do not (and lose only LCP). Rotate per release by
          # updating the repo secret; retire old values in the service's
          # RELEASE_KEYS list.
          FREEINK_LCP_RELEASE_KEY: ${{ secrets.FREEINK_LCP_RELEASE_KEY }}
        run: |
          if [ -n "$FREEINK_LCP_RELEASE_KEY" ]; then
            export PLATFORMIO_BUILD_FLAGS="-DFREEINK_LCP_RELEASE_KEY=\\\"$FREEINK_LCP_RELEASE_KEY\\\""
          fi
          CROSSPOINT_RC_HASH="$(git rev-parse --short=7 HEAD)" pio run -e "$PIO_ENV" -j1

      - name: Prepare firmware asset
        id: asset
        env:
          PIO_ENV: ${{ env.IS_PRERELEASE == 'true' && matrix.rc_env || matrix.release_env }}
          RELEASE_TAG: ${{ env.RESOLVED_TAG }}
        run: |
          version="${RELEASE_TAG#v}"
          asset="crosspoint-${version}-${{ matrix.device }}.bin"
          cp ".pio/build/${PIO_ENV}/firmware.bin" "$asset"
          echo "name=$asset" >> "$GITHUB_OUTPUT"

      - name: Prepare license asset
        if: matrix.device == 'x3-x4'
        env:
          PIO_ENV: ${{ env.IS_PRERELEASE == 'true' && matrix.rc_env || matrix.release_env }}
        run: python3 scripts/build_release_license.py --env "$PIO_ENV" --output dist/LICENSE

      - name: Stage license asset
        if: matrix.device == 'x3-x4'
        uses: actions/upload-artifact@v6
        with:
          name: release-license
          path: dist/LICENSE
          if-no-files-found: error
          retention-days: 1

      - name: Stage firmware asset
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.asset.outputs.name }}
          path: ${{ steps.asset.outputs.name }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: crosspoint-*.bin
          merge-multiple: true

      - name: Download license asset
        uses: actions/download-artifact@v4
        with:
          name: release-license
          path: dist

      - name: Publish or attach firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RESOLVED_TAG }}
          PRERELEASE: ${{ env.IS_PRERELEASE }}
        run: |
          version="${RELEASE_TAG#v}"
          for device in x3-x4 sticky x4pro x4c papermono metalio_eink4 eego_a4 picco; do
            test -f "dist/crosspoint-${version}-${device}.bin"
          done
          test "$(find dist -maxdepth 1 -type f -name 'crosspoint-*.bin' | wc -l)" -eq 8
          test -s dist/LICENSE
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/crosspoint-*.bin dist/LICENSE \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            extra_flags=()
            if [ "$PRERELEASE" = "true" ]; then
              extra_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/crosspoint-*.bin dist/LICENSE \
              --repo "$GITHUB_REPOSITORY" \
              --title "CrossPoint ${RELEASE_TAG}" \
              --generate-notes \
              "${extra_flags[@]}"
          fi
